name: CI
on: [ pull_request ]

jobs:
  test-go:
    name: Test implementation in Golang
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ^1.25.1
        id: go

      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v1

      - run: cd cmd/mkunion; go get -v -t -d ./...
      - run: cd cmd/mkunion; go build -o mkunion

      - run: go install github.com/matryer/moq@v0.6.0

      - run: go get -v -t -d ./...

      # generate code with mkunion
      - run: ./cmd/mkunion/mkunion watch -g ./...

      - run: pip install awscli-local
      - run: dev/bootstrap.sh -nologs

      # bootstrap.sh writes AWS/localstack env vars into .envrc (for direnv);
      # CI does not use direnv, so without this step tests that need
      # AWS_ENDPOINT_URL (e.g. DynamoDB repository tests) silently skip
      - name: Enable localstack-backed tests
        run: |
          {
            echo "AWS_ACCESS_KEY_ID=123"
            echo "AWS_SECRET_ACCESS_KEY=123"
            echo "AWS_DEFAULT_REGION=us-east-1"
            echo "AWS_ENDPOINT_URL=http://localhost:4566"
          } >> "$GITHUB_ENV"

      # run tests
      - run: |
          set -e
          retries=3
          until [ $retries -le 0 ]; do
            if go test -v ./...; then
              break
            fi
            echo "Retrying Go tests ($retries retries left)..."
            retries=$((retries - 1))
          done
          if [ $retries -eq 0 ]; then
            echo "Go tests failed after all retries."
            exit 1
          fi

      - run: |
          go test -race -coverprofile=coverage.out -covermode=atomic ./... || true

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5.5.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: widmogrod/mkunion